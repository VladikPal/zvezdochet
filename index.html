<style>

 background:radial-gradient(circle at 35% 30%,#fff7d0,#ffd36b 35%,hsl(calc(var(--h)),80%,55%) 75%,hsl(calc(var(--h)),70%,25%));box-shadow:0 0 40px hsl(var(--h),90%,60%,.55),0 0 90px hsl(var(--h),90%,60%,.25);transition:transform .08s;animation:float 4s ease-in-out infinite}

@keyframes tin{from{transform:translateY(-10px);opacity:0}}@keyframes tout{to{opacity:0}}

 <div id="top"><div id="dust">0</div><div id="pps"></div><div id="chips"></div><div id="goal"></div></div>

<script>
'use strict';
/* ===================== ЯДРО (без DOM) ===================== */
const SAVE_KEY='zvezdochet_save_v1';
let _now=()=>Date.now();
const ui={toast(){},modal(){},haptic(){},sfx(){},unlock(){}};

const SUF=['','K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc','Ud','Dd','Td','Qd'];
function fmt(n){
  if(typeof n!=='number'||n!==n)return '0';
  if(!isFinite(n))return n>0?'∞':'-∞';
  if(n<0)return '-'+fmt(-n);
  if(n<1000)return n<10?(Math.floor(n*10)/10).toString():Math.floor(n).toString();
  let e=Math.floor(Math.log10(n)/3);
  if(e>=SUF.length){const x=Math.floor(Math.log10(n));return (n/Math.pow(10,x)).toFixed(2)+'e'+x;}
  let v=n/Math.pow(1000,e);
  if(v>=999.995){v=1;e++;if(e>=SUF.length)return '1.00e'+(e*3);}
  return v.toFixed(v<10?2:v<100?1:0)+SUF[e];
}
function fmtT(s){
  s=Math.max(0,Math.ceil(s));
  const h=Math.floor(s/3600),m=Math.floor(s%3600/60),c=s%60;
  return h>0?h+'ч '+m+'м':m>0?m+'м '+(c<10?'0':'')+c+'с':c+'с';
}

const NAMES=[['Телескоп-любитель','🔭'],['Радиоантенна','📡'],['Спутник-сборщик','🛰️'],['Лунная станция','🌙'],['Орбитальный причал','🚀'],['Ловец комет','☄️'],['Кольцевая верфь','🪐'],['Солнечный жнец','☀️'],['Вихревой коллектор','🌀'],['Галактическая сеть','🌌'],['Квазар-ферма','🕳️'],['Сердце мироздания','✨']];
const NB=NAMES.length;
const BUILD=NAMES.map((x,i)=>({n:x[0],e:x[1],c:15*Math.pow(11,i),p:0.1*Math.pow(6.5,i),ep:i===10?2:i===11?4:0}));
const GR=1.18;
const MILE=[25,50,100,150,200,250,300,400];
const BU=[[5,15,2],[25,500,2],[50,20000,3]];      // [нужно штук, цена×базовая, множитель]
const GUP=[2e3,5e4,1e6,3e7,1e9,3e10,1e12,5e13,2e15,1e17];  // ×1.5 всему
const TUP=[100,5e3,3e5,2e7,1e9,1e11];            // ×2 к тапу
const EXP_AT=2e5;           // накоплено пыли за всё время — открываются экспедиции
const PREST_K=1e9;          // знаменатель формулы Озарения
const PREST_EXP=0.3;        // степень формулы Озарения
const MISS=[
 {n:'Окрестности',e:'🌍',t:120,sh:4,ep:0},
 {n:'Горный перевал',e:'⛰️',t:600,sh:25,ep:0},
 {n:'Тёмная пустошь',e:'🌑',t:1800,sh:90,ep:0},
 {n:'Руины Древних',e:'🏛️',t:7200,sh:400,ep:1},
 {n:'Край Туманности',e:'🌫️',t:28800,sh:1700,ep:3}];
const PERKS=[
 {id:'help',n:'Помощники',e:'🤝',d:'Старт эпохи: по 5 штук трёх первых построек за уровень',max:10,c:2,g:1.7},
 {id:'sleep',n:'Долгий сон',e:'😴',d:'+2 ч к лимиту оффлайн-дохода',max:5,c:3,g:2.2},
 {id:'calm',n:'Тихий ход',e:'🌙',d:'+10% эффективности оффлайн-дохода',max:5,c:4,g:2.4},
 {id:'hand',n:'Золотая рука',e:'👆',d:'+1% производства к каждому тапу',max:10,c:2,g:1.6},
 {id:'mind',n:'Мудрость мастера',e:'🧠',d:'−3% к цене построек',max:10,c:3,g:1.7},
 {id:'speed',n:'Быстрые корабли',e:'⚡',d:'−6% времени экспедиций',max:8,c:4,g:1.9},
 {id:'crew',n:'Больше экипажей',e:'👥',d:'+1 слот экспедиций',max:2,c:8,g:6},
 {id:'pull',n:'Притяжение',e:'🧲',d:'Метеоры прилетают на 8% чаще',max:5,c:3,g:2},
 {id:'echo',n:'Эхо созвездий',e:'🔔',d:'+10% осколков из экспедиций',max:10,c:5,g:1.7},
 {id:'shine',n:'Сияние',e:'🌟',d:'+5% ко всему производству',max:20,c:5,g:1.45},
 {id:'auto',n:'Автоинженер',e:'🤖',d:'Сам покупает постройки (включается в настройках)',max:1,c:25,g:1}];
const CONS=[
 {id:'ursa',n:'Большая Медведица',e:'🐻',d:'+10% ко всему производству'},
 {id:'orion',n:'Орион',e:'🏹',d:'+25% к силе тапа'},
 {id:'lyra',n:'Лира',e:'🎵',d:'+25% к награде метеоров'},
 {id:'cygnus',n:'Лебедь',e:'🦢',d:'+15% осколков из экспедиций'},
 {id:'cass',n:'Кассиопея',e:'👑',d:'−3% к цене построек'},
 {id:'draco',n:'Дракон',e:'🐉',d:'+5% Озарения при новой эпохе'},
 {id:'pegasus',n:'Пегас',e:'🐎',d:'−6% времени экспедиций'},
 {id:'sag',n:'Стрелец',e:'🎯',d:'+1 ч к лимиту оффлайн-дохода'},
 {id:'andro',n:'Андромеда',e:'🌠',d:'×1.15 постройкам №7–12'},
 {id:'taurus',n:'Телец',e:'🐂',d:'×1.2 постройкам №1–6'},
 {id:'scorp',n:'Скорпион',e:'🦂',d:'+20% длительности бурь от комет'},
 {id:'pisces',n:'Рыбы',e:'🐟',d:'С 2 уровня: +1 слот экспедиций'}];
CONS.forEach((c,j)=>{c.base=Math.round(5*Math.pow(1.7,j));c.max=5;});
const CLVL=2.5;
const DAILY=[
 {t:'dust',v:20,txt:'20 минут производства'},{t:'shard',v:15,txt:'15 осколков'},{t:'buff',v:2,txt:'×2 производство на 20 минут'},
 {t:'dust',v:90,txt:'1,5 часа производства'},{t:'shard',v:60,txt:'60 осколков'},{t:'buff',v:3,txt:'×3 производство на 20 минут'},
 {t:'light',v:2,txt:'2 Озарения + 3 часа производства'}];

function newState(){
  return {v:1,dust:0,run:0,total:0,shards:0,lights:0,lightsTotal:0,epoch:0,
    b:Array(NB).fill(0),up:{},perks:{},cons:{},exs:[],ach:{},buffs:[],
    stats:{taps:0,meteors:0,bought:0,exps:0,play:0,earned:0,prestiges:0,maxPps:0,comets:0,bestGain:0,totalShards:0},
    daily:{streak:0,last:'',claimed:''},quests:{date:'',list:[]},
    set:{sound:false,haptic:true,auto:false,buy:1},unl:{exp:false,con:false,pres:false},
    tut:0,seen:{},last:_now(),created:_now()};
}
let S=newState();

/* ----- Эффекты ----- */
let FX=null,PB=null;
function dirty(){FX=null;PB=null;}
function lvl(map,id){return map[id]||0;}
function achCount(){let n=0;for(const k in S.ach)if(S.ach[k])n++;return n;}
function fx(){
  if(FX)return FX;
  const P=id=>lvl(S.perks,id),C=id=>lvl(S.cons,id);
  const f={bm:Array(NB).fill(1),glob:1,tap:1,tapFrac:0.01+0.01*P('hand'),costMul:1,
    offCap:(8+2*P('sleep')+C('sag'))*3600,offEff:Math.min(1,0.5+0.1*P('calm')),
    expSpeed:Math.max(0.25,Math.pow(0.94,P('speed'))*(1-0.06*C('pegasus'))),
    slots:1+P('crew')+(C('pisces')>=2?1:0),meteorInt:Math.pow(0.92,P('pull')),
    shardMul:(1+0.1*P('echo'))*(1+0.15*C('cygnus')),meteorMul:1+0.25*C('lyra'),
    lightMul:1+0.05*C('draco'),stormMul:1+0.2*C('scorp'),auto:P('auto')>0};
  for(let i=0;i<NB;i++){
    let m=1;
    for(let k=0;k<BU.length;k++)if(S.up['b'+i+'_'+k])m*=BU[k][2];
    if(i<6)m*=1+0.2*C('taurus');else m*=1+0.15*C('andro');
    f.bm[i]=m;
  }
  let g=1;for(let k=0;k<GUP.length;k++)if(S.up['g'+k])g*=1.5;
  f.glob=g*lightMult(S.lightsTotal)*(1+0.01*achCount())*(1+0.1*C('ursa'))*(1+0.05*P('shine'));
  let t=1;for(let k=0;k<TUP.length;k++)if(S.up['t'+k])t*=2;
  f.tap=t*(1+0.25*C('orion'));
  f.costMul=Math.max(0.3,Math.pow(0.97,P('mind')+C('cass')));
  FX=f;return f;
}
function lightMult(L){return Math.sqrt(1+L);}
function mile(n){let m=1;for(let k=0;k<MILE.length;k++)if(n>=MILE[k])m*=2;return m;}
function basePps(){
  if(PB!==null)return PB;
  const f=fx();let s=0;
  for(let i=0;i<NB;i++){const o=S.b[i];if(o>0)s+=o*BUILD[i].p*mile(o)*f.bm[i];}
  PB=s*f.glob;return PB;
}
function buffMult(){const t=_now();let m=1;for(const b of S.buffs)if(b.end>t)m*=b.mult;return m;}
function pps(){return basePps()*buffMult();}
function tapValue(){return (1+basePps()*fx().tapFrac)*fx().tap*buffMult();}

/* ----- Стройка ----- */
function unitCost(i){return BUILD[i].c*Math.pow(GR,S.b[i])*fx().costMul;}
function bulkCost(i,n){return n===1?unitCost(i):unitCost(i)*(Math.pow(GR,n)-1)/(GR-1);}
function maxBuy(i){
  const c=unitCost(i);if(S.dust<c)return 0;
  const n=Math.floor(Math.log(S.dust*(GR-1)/c+1)/Math.log(GR)+1e-9);
  return Math.max(0,Math.min(n,5000));
}
function bAvail(i){return BUILD[i].ep<=S.epoch;}
function buy(i,n){
  if(!bAvail(i))return 0;
  if(n==='max')n=maxBuy(i);
  n=Math.floor(n);if(n<1)return 0;
  const c=bulkCost(i,n);
  if(!(S.dust>=c*(1-1e-12))){return 0;}
  S.dust=Math.max(0,S.dust-c);S.b[i]+=n;S.stats.bought+=n;dirty();return n;
}
function earn(x){
  if(!(x>0)||!isFinite(x))return;
  S.dust+=x;S.run+=x;S.total+=x;S.stats.earned+=x;
}
function tapNow(){
  const v=tapValue();earn(v);S.stats.taps++;return v;
}

/* ----- Улучшения ----- */
function upList(){
  const L=[];
  for(let i=0;i<NB;i++){
    if(!bAvail(i))continue;
    for(let k=0;k<BU.length;k++){
      const id='b'+i+'_'+k;if(S.up[id])continue;
      if(S.b[i]>=BU[k][0])L.push({id,e:BUILD[i].e,n:BUILD[i].n+' ×'+BU[k][2],d:'Производство этой постройки ×'+BU[k][2],cost:BUILD[i].c*BU[k][1]});
    }
  }
  for(let k=0;k<GUP.length;k++){const id='g'+k;if(!S.up[id]&&S.run>=GUP[k]*0.15)L.push({id,e:'⚗️',n:'Звёздный катализатор '+(k+1),d:'Всё производство ×1.5',cost:GUP[k]});}
  for(let k=0;k<TUP.length;k++){const id='t'+k;if(!S.up[id]&&S.run>=TUP[k]*0.15)L.push({id,e:'👆',n:'Сила касания '+(k+1),d:'Тап ×2',cost:TUP[k]});}
  L.sort((a,b)=>a.cost-b.cost);return L;
}
function buyUp(id){
  const u=upList().find(x=>x.id===id);
  if(!u||!(S.dust>=u.cost))return false;
  S.dust-=u.cost;S.up[id]=true;S.stats.bought+=0;dirty();return true;
}

/* ----- Эпоха (престиж) ----- */
function prestigeGain(){
  const g=Math.floor(Math.pow(S.run/PREST_K,PREST_EXP)*fx().lightMul);
  return g>0&&isFinite(g)?g:0;
}
function doPrestige(){
  const g=prestigeGain();if(g<1)return 0;
  S.lights+=g;S.lightsTotal+=g;S.epoch++;S.stats.prestiges++;
  if(g>S.stats.bestGain)S.stats.bestGain=g;
  S.dust=0;S.run=0;S.b=Array(NB).fill(0);S.up={};S.buffs=[];
  const h=lvl(S.perks,'help');
  if(h>0)for(let i=0;i<3;i++)S.b[i]=5*h;
  dirty();return g;
}
function perkCost(p){return Math.round(p.c*Math.pow(p.g,lvl(S.perks,p.id)));}
function buyPerk(id){
  const p=PERKS.find(x=>x.id===id);if(!p)return false;
  const l=lvl(S.perks,id);if(l>=p.max)return false;
  const c=perkCost(p);if(S.lights<c)return false;
  S.lights-=c;S.perks[id]=l+1;dirty();return true;
}

/* ----- Созвездия ----- */
function conCost(c){return Math.round(c.base*Math.pow(CLVL,lvl(S.cons,c.id)));}
function buyCon(id){
  const c=CONS.find(x=>x.id===id);if(!c)return false;
  const l=lvl(S.cons,id);if(l>=c.max)return false;
  const k=conCost(c);if(S.shards<k)return false;
  S.shards-=k;S.cons[id]=l+1;dirty();return true;
}

/* ----- Экспедиции ----- */
function missDur(m){return Math.max(10,Math.round(MISS[m].t*fx().expSpeed));}
function missOpen(m){return MISS[m].ep<=S.epoch;}
function startExp(m){
  if(!S.unl.exp||!missOpen(m)||S.exs.length>=fx().slots)return false;
  S.exs.push({m,start:_now(),end:_now()+missDur(m)*1000});return true;
}
function collectExp(idx,rnd){
  const e=S.exs[idx];if(!e||_now()<e.end)return null;
  const M=MISS[e.m];
  const r=(rnd===undefined?Math.random():rnd);
  const sh=Math.max(1,Math.round(M.sh*fx().shardMul*(0.85+0.3*r)));
  const dur=(e.end-e.start)/1000;
  const du=basePps()*dur*0.25;
  S.shards+=sh;S.stats.totalShards=(S.stats.totalShards||0)+sh;earn(du);S.stats.exps++;
  S.exs.splice(idx,1);return {sh,du,m:e.m};
}

/* ----- Метеоры ----- */
function meteorKind(r){
  if(r<0.08)return 'storm';
  if(r<0.22&&S.unl.exp)return 'shard';
  return 'dust';
}
function catchMeteor(kind){
  S.stats.meteors++;const f=fx();
  if(kind==='storm'){
    const d=30*f.stormMul;S.buffs.push({mult:7,end:_now()+d*1000,name:'Буря ×7'});S.stats.comets++;
    return {t:'🌟 Звёздная буря! ×7 на '+Math.round(d)+' с'};
  }
  if(kind==='shard'){
    const n=Math.max(1,Math.round((2+S.epoch*2)*f.shardMul));S.shards+=n;S.stats.totalShards=(S.stats.totalShards||0)+n;
    return {t:'💎 +'+n+' осколков'};
  }
  const v=Math.max(20*tapValue()/buffMult(),pps()*40/buffMult()*1)*f.meteorMul;
  earn(v);return {t:'🌠 +'+fmt(v)+' пыли',v};
}

/* ----- Баффы, оффлайн ----- */
function applyOffline(sec){
  if(!(sec>0))return {sec:0,gain:0};
  const f=fx();sec=Math.min(sec,f.offCap);
  const g=basePps()*sec*f.offEff;earn(g);
  return {sec,gain:g};
}
function tick(dt){
  if(!(dt>0))return;
  earn(pps()*dt);
  S.stats.play+=dt;
  const p=pps();if(p>S.stats.maxPps)S.stats.maxPps=p;
  if(S.buffs.length){const t=_now();S.buffs=S.buffs.filter(b=>b.end>t);}
}
let _autoT=0;
function autoBuy(dt){
  if(!S.set.auto||!fx().auto)return;
  _autoT+=dt;if(_autoT<1)return;_autoT=0;
  for(let r=0;r<5;r++){
    let bi=-1,bc=Infinity;
    for(let i=0;i<NB;i++){if(!bAvail(i))continue;const c=unitCost(i);if(c<bc&&c<=S.dust){bc=c;bi=i;}}
    if(bi<0)break;buy(bi,1);
  }
}

/* ----- Ежедневное ----- */
function dkey(t){const d=new Date(t===undefined?_now():t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function dayDiff(a,b){return Math.round((Date.parse(b+'T12:00:00')-Date.parse(a+'T12:00:00'))/864e5);}
function dailyState(){
  const k=dkey();
  if(S.daily.claimed===k)return {can:false,day:((S.daily.streak-1)%7+7)%7};
  let st=S.daily.streak;
  if(S.daily.last&&dayDiff(S.daily.last,k)>1)st=0;
  return {can:true,day:st%7,next:st+1};
}
function claimDaily(){
  const d=dailyState();if(!d.can)return null;
  const k=dkey();S.daily.streak=d.next;S.daily.last=k;S.daily.claimed=k;
  const r=DAILY[d.day];let txt;
  const mins=m=>Math.max(200,basePps()*m*60);
  if(r.t==='dust'){const g=mins(r.v);earn(g);txt='+'+fmt(g)+' пыли';}
  else if(r.t==='shard'){if(S.unl.exp){S.shards+=r.v*(1+S.epoch);txt='+'+r.v*(1+S.epoch)+' осколков';}else{const g=mins(40);earn(g);txt='+'+fmt(g)+' пыли';}}
  else if(r.t==='buff'){S.buffs.push({mult:r.v,end:_now()+20*60000,name:'Дар ×'+r.v});txt='×'+r.v+' на 20 минут';}
  else{S.lights+=r.v;S.lightsTotal+=r.v;const g=mins(180);earn(g);txt='+'+r.v+' Озарения, +'+fmt(g)+' пыли';dirty();}
  return txt;
}
const QPOOL=[
 {k:'taps',stat:'taps',tg:()=>150+Math.floor(Math.random()*100),txt:n=>'Нажми на звезду '+n+' раз'},
 {k:'meteors',stat:'meteors',tg:()=>4+Math.floor(Math.random()*3),txt:n=>'Поймай метеоров: '+n},
 {k:'bought',stat:'bought',tg:()=>20+Math.floor(Math.random()*20),txt:n=>'Построй зданий: '+n},
 {k:'exps',stat:'exps',tg:()=>2,txt:n=>'Заверши экспедиций: '+n,need:'exp'},
 {k:'earned',stat:'earned',tg:()=>Math.max(1000,basePps()*1800),txt:n=>'Добудь '+fmt(n)+' пыли'}];
function ensureQuests(){
  const k=dkey();if(S.quests.date===k)return;
  const pool=QPOOL.filter(q=>!q.need||S.unl[q.need]);
  const pick=[];
  while(pick.length<3&&pool.length){pick.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);}
  S.quests={date:k,list:pick.map(q=>{const t=q.tg();return {k:q.k,target:t,base:S.stats[q.stat]||0,done:false};})};
}
function questProg(q){const d=QPOOL.find(x=>x.k===q.k);return Math.min(q.target,(S.stats[d.stat]||0)-q.base);}
function claimQuest(i){
  const q=S.quests.list[i];if(!q||q.done||questProg(q)<q.target)return null;
  q.done=true;
  const g=Math.max(100,basePps()*900);earn(g);let txt='+'+fmt(g)+' пыли';
  if(S.unl.exp){const s=8*(1+S.epoch);S.shards+=s;txt+=', +'+s+' осколков';}
  return txt;
}

/* ----- Сохранение ----- */
function merge(base,src){
  if(!src||typeof src!=='object')return base;
  for(const k in base){
    const b=base[k],s=src[k];
    if(s===undefined||s===null)continue;
    if(Array.isArray(b)){if(Array.isArray(s))for(let i=0;i<b.length;i++)if(typeof s[i]==='number'&&isFinite(s[i])&&s[i]>=0)b[i]=s[i];}
    else if(typeof b==='object'){base[k]=merge(b,s);}
    else if(typeof b==='number'){if(typeof s==='number'&&isFinite(s))base[k]=s;}
    else if(typeof b==='string'){if(typeof s==='string')base[k]=s;}
    else if(typeof b==='boolean'){if(typeof s==='boolean')base[k]=s;}
  }
  // свободные словари
  for(const k of ['up','perks','cons','ach','seen']){
    if(src[k]&&typeof src[k]==='object'){base[k]={};for(const x in src[k]){const v=src[k][x];if(typeof v==='boolean'||(typeof v==='number'&&isFinite(v)))base[k][x]=v;}}
  }
  if(Array.isArray(src.exs))base.exs=src.exs.filter(e=>e&&Number.isFinite(e.m)&&e.m>=0&&e.m<MISS.length&&Number.isFinite(e.start)&&Number.isFinite(e.end)).map(e=>({m:e.m,start:e.start,end:e.end}));
  if(Array.isArray(src.buffs))base.buffs=src.buffs.filter(e=>e&&Number.isFinite(e.mult)&&Number.isFinite(e.end)).map(e=>({mult:e.mult,end:e.end,name:String(e.name||'')}));
  if(src.quests&&Array.isArray(src.quests.list))base.quests.list=src.quests.list.filter(q=>q&&typeof q.k==='string'&&QPOOL.some(x=>x.k===q.k)&&Number.isFinite(q.target)&&Number.isFinite(q.base)).map(q=>({k:q.k,target:q.target,base:q.base,done:!!q.done}));
  return base;
}
function sanitize(){
  for(const k of ['dust','run','total','shards','lights','lightsTotal'])if(!isFinite(S[k])||S[k]<0)S[k]=0;
  for(let i=0;i<NB;i++)if(!isFinite(S.b[i])||S.b[i]<0)S.b[i]=0;
}
function serialize(){sanitize();S.last=_now();return JSON.stringify(S);}
function saveGame(){try{localStorage.setItem(SAVE_KEY,serialize());return true;}catch(e){return false;}}
function loadObj(o){
  const ns=merge(newState(),o);
  if(!(ns.v>=1))throw new Error('bad');
  if(ns.last>_now()+864e5)ns.last=_now();
  S=ns;dirty();
}
function loadGame(){
  try{const raw=localStorage.getItem(SAVE_KEY);if(!raw)return false;loadObj(JSON.parse(raw));return true;}catch(e){return false;}
}

function importSave(txt){
  txt=String(txt||'').replace(/\s+/g,'');
  if(txt.indexOf('ZV1:')!==0)return false;
  try{const o=JSON.parse(decodeURIComponent(escape(atob(txt.slice(4)))));if(!o||typeof o!=='object'||!(o.v>=1))return false;loadObj(o);S.last=_now();return true;}catch(e){return false;}
}

function beep(f,d,type,v){

  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.value=f;
    g.gain.value=v||0.05;g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+d);
    o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d);
  }catch(e){}
}

function draw(ts){
  cx.clearRect(0,0,cw,ch2);
  const hue=(250+S.epoch*47)%360;
  const g=cx.createRadialGradient(cw/2,ch2/2,10,cw/2,ch2/2,Math.max(cw,ch2)*0.7);
  g.addColorStop(0,'hsla('+hue+',60%,22%,.55)');g.addColorStop(1,'hsla('+hue+',60%,6%,0)');
  cx.fillStyle=g;cx.fillRect(0,0,cw,ch2);
  const t=ts/1000;
  for(const s of stars){cx.globalAlpha=0.35+0.65*Math.abs(Math.sin(t*s.s+s.o));cx.fillStyle='#fff';cx.beginPath();cx.arc(s.x,s.y,s.r,0,6.3);cx.fill();}
  cx.globalAlpha=1;
  if(!document.hidden)requestAnimationFrame(draw);
}
window.addEventListener('resize',resize);
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault());

/* --- главный цикл --- */
let lastT=_now(),sec1=0,saveT=0;
function offlineReport(dt){
  const r=applyOffline(dt);
  checkUnlocks();
  const ready=S.exs.filter(e=>_now()>=e.end).length;
  if(dt>=60&&(r.gain>0||ready)){
    modal('<div class="big">🌙</div><h2>С возвращением!</h2><p>Тебя не было '+fmtT(dt)+(dt>r.sec+1?' (засчитано до '+fmtT(r.sec)+')':'')+'.</p><p>Пока ты спал, телескопы собрали <b style="color:var(--gold)">'+fmt(r.gain)+'</b> пыли (эффективность '+Math.round(fx().offEff*100)+'%).</p>'+(ready?'<p>🧭 Экспедиции вернулись: '+ready+'. Забери награды!</p>':'')+'<p class="t">Лимит и эффективность растут от даров эпохи и созвездий.</p>');
    ui.sfx('big');
  }
}
function loop(){
  const t=_now();let dt=(t-lastT)/1000;lastT=t;
  if(dt<0)dt=0;
  if(dt>60)offlineReport(dt);
  else{tick(dt);autoBuy(dt);}
  sec1+=dt;
  if(sec1>=1){sec1=0;checkUnlocks();checkAch();renderTabs();
    // tutorial
    if(S.tut<TUT.length&&TUT[S.tut].d()){S.tut++;ui.sfx('ach');}
    if(S.tut===3&&S.stats.meteors===0&&nextMet-_now()>8000)nextMet=_now()+4000;}
  meteorTimer();
  live();
  saveT+=dt;if(saveT>=10){saveT=0;saveGame();}
}
function boot(){
  const loaded=loadGame();
  initTg();
  ensureQuests();setHue();checkUnlocks();
  resize();requestAnimationFrame(draw);
  renderTabs();renderPanel(true);
  const away=loaded?(_now()-S.last)/1000:0;
  lastT=_now();
  if(away>60)offlineReport(away);
  else if(!loaded)modal('<div class="big">🔭</div><h2>Звездочёт</h2><p>Ты — хранитель маленькой обсерватории. Лови звёздную пыль, строй станции, отправляй экспедиции и открывай созвездия. Игра идёт и пока тебя нет!</p><p>Начни с касания светящейся звезды ⭐</p>');
  setInterval(loop,100);
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden){saveGame();}
    else{requestAnimationFrame(draw);}
  });
  window.addEventListener('pagehide',saveGame);
  window.addEventListener('beforeunload',saveGame);
}
if(typeof document!=='undefined'&&document.getElementById&&document.getElementById('orb'))boot();
</script>
